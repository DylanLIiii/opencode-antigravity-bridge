name: Quota queries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  usage:
    name: Usage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test-native-accounts.mjs test-platform.mjs test-usage.mjs test-wsl.mjs test-step-usage.mjs test-step-usage-extra.mjs test-tool-schema.mjs test-schema-parity.mjs test-mcp-server.mjs test-upstream-error.mjs test-model-discovery.mjs
      - run: node test/array-items-unit.mjs
