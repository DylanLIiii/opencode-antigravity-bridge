name: Quota queries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  usage:
    name: Usage (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test-auth-retry.mjs test-compat.mjs test-context-ui.mjs test-native-accounts.mjs test-platform.mjs test-usage.mjs test-wsl.mjs test-step-usage.mjs test-step-usage-extra.mjs test-tool-schema.mjs test-schema-parity.mjs test-mcp-server.mjs test-upstream-error.mjs test-model-discovery.mjs
      - run: node test/array-items-unit.mjs
      - name: Create a checkout whose path contains spaces
        run: git worktree add --detach "bridge fixture checkout" HEAD
      - run: node --test test-auth-retry.mjs test-compat.mjs
        working-directory: bridge fixture checkout
